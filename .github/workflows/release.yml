name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: graphcraft-stable-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      tag_oid: ${{ steps.release.outputs.tag_oid }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify release metadata and signed annotated tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
        run: >-
          node scripts/verify-release.mjs preflight
          --tag "$GITHUB_REF_NAME"
          --event-sha "$RELEASE_EVENT_SHA"
          --require-ref origin/main
          --github-repository "$GITHUB_REPOSITORY"
      - id: release
        name: Export release identity
        shell: bash
        run: |
          set -euo pipefail
          tag_oid="$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME")"
          commit="$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{commit}")"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag_oid=$tag_oid" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  ci:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  dependency-audit:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  secret-scan:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          version: 3.95.9
          extra_args: --only-verified

  package:
    needs: [preflight, ci, dependency-audit, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify package contents
        run: |
          pnpm build
          node scripts/check-package.mjs
      - id: artifact
        name: Pack twice and verify reproducibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release/first" "$RUNNER_TEMP/release/second"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release/first" > "$RUNNER_TEMP/release/first.json"
          first_name="$(node -e 'const fs = require("node:fs"); const [entry] = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(entry.filename)' "$RUNNER_TEMP/release/first.json")"
          pnpm build
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release/second" > "$RUNNER_TEMP/release/second.json"
          second_name="$(node -e 'const fs = require("node:fs"); const [entry] = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(entry.filename)' "$RUNNER_TEMP/release/second.json")"
          node scripts/verify-release.mjs compare \
            --left "$RUNNER_TEMP/release/first/$first_name" \
            --right "$RUNNER_TEMP/release/second/$second_name"
          node scripts/verify-release.mjs artifact \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --tag-oid "${{ needs.preflight.outputs.tag_oid }}" \
            --commit "${{ needs.preflight.outputs.commit }}" \
            --tarball "$RUNNER_TEMP/release/first/$first_name" \
            --output "$RUNNER_TEMP/release/release-manifest.json"
          node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.writeFileSync(process.argv[2], `${manifest.digests.sha256}  ${manifest.tarball}\n`)' \
            "$RUNNER_TEMP/release/release-manifest.json" \
            "$RUNNER_TEMP/release/SHA256SUMS"
          packed_tarball="$(node scripts/verify-release.mjs verify-artifact \
            --manifest "$RUNNER_TEMP/release/release-manifest.json" \
            --directory "$RUNNER_TEMP/release/first")"
          cp -- "$packed_tarball" "$RUNNER_TEMP/release/$first_name"
          tarball="$(node scripts/verify-release.mjs verify-artifact \
            --manifest "$RUNNER_TEMP/release/release-manifest.json" \
            --directory "$RUNNER_TEMP/release")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Revalidate release identity before artifact publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-release.mjs verify-identity
          --tag "${{ needs.preflight.outputs.tag }}"
          --tag-oid "${{ needs.preflight.outputs.tag_oid }}"
          --commit "${{ needs.preflight.outputs.commit }}"
          --require-ref origin/main
          --github-repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ needs.preflight.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.tarball }}
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  tarball-smoke:
    needs: [preflight, package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        method: [npm, pnpm, npx, pnpm-dlx]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Clean ${{ matrix.method }} tarball smoke on ${{ matrix.os }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(node scripts/verify-release.mjs verify-artifact \
            --manifest "$RUNNER_TEMP/release/release-manifest.json" \
            --directory "$RUNNER_TEMP/release")"
          node scripts/verify-release.mjs smoke \
            --source "$tarball" \
            --method "${{ matrix.method }}" \
            --version "${{ needs.preflight.outputs.version }}"

  publish:
    needs: [preflight, dependency-audit, secret-scan, tarball-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tpypan/graphcraft/v/${{ needs.preflight.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Require npm trusted-publishing support
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1))))
          throw new Error(`npm ${process.argv[1]} does not support trusted publishing`)'
          "$(npm --version)"
      - id: registry
        name: Reconcile an earlier publish attempt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs verify-release-order \
            --manifest "$RUNNER_TEMP/release/release-manifest.json"
          state="$(node scripts/verify-release.mjs registry-state --manifest "$RUNNER_TEMP/release/release-manifest.json")"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Publish through npm trusted publishing
        if: steps.registry.outputs.state == 'missing'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs verify-identity \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --tag-oid "${{ needs.preflight.outputs.tag_oid }}" \
            --commit "${{ needs.preflight.outputs.commit }}" \
            --require-ref origin/main \
            --github-repository "$GITHUB_REPOSITORY"
          tarball="$(node scripts/verify-release.mjs verify-artifact \
            --manifest "$RUNNER_TEMP/release/release-manifest.json" \
            --directory "$RUNNER_TEMP/release")"
          npm publish "$tarball" \
            --access public \
            --provenance \
            --registry https://registry.npmjs.org/
      - name: Verify exact published integrity, provenance, and registry signature
        run: >-
          node scripts/verify-release.mjs verify-published
          --manifest "$RUNNER_TEMP/release/release-manifest.json"
          --attempts 20
          --delay-ms 15000
      - name: Verify stable npm dist-tag
        run: >-
          node scripts/verify-release.mjs verify-dist-tag
          --manifest "$RUNNER_TEMP/release/release-manifest.json"
          --attempts 20
          --delay-ms 15000
      - name: Verify npm registry signatures and provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          audit_root="$(mktemp -d)"
          cd "$audit_root"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact \
            "@tpypan/graphcraft@${{ needs.preflight.outputs.version }}"
          npm audit signatures

  published-smoke:
    needs: [preflight, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        method: [npm, pnpm, npx, pnpm-dlx]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Clean ${{ matrix.method }} published-package smoke on ${{ matrix.os }}
        run: >-
          node scripts/verify-release.mjs smoke
          --source "@tpypan/graphcraft@${{ needs.preflight.outputs.version }}"
          --method "${{ matrix.method }}"
          --version "${{ needs.preflight.outputs.version }}"

  github-release:
    needs: [preflight, published-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Create or reconcile the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs verify-identity \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --tag-oid "${{ needs.preflight.outputs.tag_oid }}" \
            --commit "${{ needs.preflight.outputs.commit }}" \
            --require-ref origin/main \
            --github-repository "$GITHUB_REPOSITORY"
          tarball="$(node scripts/verify-release.mjs verify-artifact \
            --manifest "$RUNNER_TEMP/release/release-manifest.json" \
            --directory "$RUNNER_TEMP/release")"
          notes="docs/releases/${{ needs.preflight.outputs.tag }}.md"
          title="Graphcraft ${{ needs.preflight.outputs.tag }}"
          if gh release view "${{ needs.preflight.outputs.tag }}" >/dev/null 2>&1; then
            existing_release="$(mktemp)"
            existing_latest="$(mktemp)"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ needs.preflight.outputs.tag }}" > "$existing_release"
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$existing_latest"
            node -e '
              const fs = require("node:fs");
              const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const latest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
              const [tag, title, notes, tarball] = process.argv.slice(3);
              const normalize = (value) => String(value).replaceAll("\r\n", "\n").replace(/\n+$/u, "");
              if (release.tag_name !== tag || release.draft || release.prerelease) throw new Error("Existing GitHub release is not the exact stable tag");
              if (release.immutable !== true) throw new Error("Existing GitHub release is not immutable");
              if (release.name !== title || normalize(release.body) !== normalize(fs.readFileSync(notes, "utf8"))) throw new Error("Existing GitHub release title or notes differ");
              if (latest.id !== release.id || latest.tag_name !== tag) throw new Error("Existing GitHub release is not latest");
              const expected = [tarball, "release-manifest.json", "SHA256SUMS"].sort();
              const actual = release.assets.map(({ name }) => name).sort();
              if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Existing GitHub release assets differ: ${actual.join(", ")}`);
            ' "$existing_release" "$existing_latest" "${{ needs.preflight.outputs.tag }}" "$title" "$notes" "$(basename "$tarball")"
          else
            gh release create "${{ needs.preflight.outputs.tag }}" \
              --latest \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes" \
              "$tarball" \
              "$RUNNER_TEMP/release/release-manifest.json" \
              "$RUNNER_TEMP/release/SHA256SUMS"
          fi
          node scripts/verify-release.mjs verify-identity \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --tag-oid "${{ needs.preflight.outputs.tag_oid }}" \
            --commit "${{ needs.preflight.outputs.commit }}" \
            --require-ref origin/main \
            --github-repository "$GITHUB_REPOSITORY"
          release_json="$(mktemp)"
          latest_release_json="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ needs.preflight.outputs.tag }}" > "$release_json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_release_json"
          node -e '
            const fs = require("node:fs");
            const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const latest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const [tag, tarball] = process.argv.slice(3);
            if (release.tag_name !== tag || release.draft || release.prerelease) throw new Error("GitHub release is not the exact stable tag");
            if (release.immutable !== true) throw new Error("GitHub release immutability is not enabled");
            if (latest.id !== release.id || latest.tag_name !== tag) throw new Error("GitHub latest release is not the verified stable tag");
            const assets = release.assets.map(({ name }) => name).sort();
            const expected = [tarball, "release-manifest.json", "SHA256SUMS"].sort();
            if (JSON.stringify(assets) !== JSON.stringify(expected)) throw new Error(`GitHub release assets differ: ${assets.join(", ")}`);
          ' "$release_json" "$latest_release_json" "${{ needs.preflight.outputs.tag }}" "$(basename "$tarball")"
          downloaded_assets="$(mktemp -d)"
          gh release download "${{ needs.preflight.outputs.tag }}" --dir "$downloaded_assets"
          cmp -s "$tarball" "$downloaded_assets/$(basename "$tarball")" || { echo "GitHub release tarball differs" >&2; exit 1; }
          cmp -s "$RUNNER_TEMP/release/release-manifest.json" "$downloaded_assets/release-manifest.json" || { echo "GitHub release manifest differs" >&2; exit 1; }
          cmp -s "$RUNNER_TEMP/release/SHA256SUMS" "$downloaded_assets/SHA256SUMS" || { echo "GitHub release checksums differ" >&2; exit 1; }
